# /etc/nginx/sites-available/dayone-pages.conf
#
# Catch-all: qualquer Host chega aqui (default_server + server_name _).
# Só HTTP: o TLS é do Cloudflare (modo Flexible). Tudo vai para o index.php.

# IPs do Cloudflare, para o CF-Connecting-IP virar o IP real nos logs.
# Atualize com deploy/cloudflare-allowlist.sh (que também fecha o firewall).
include /etc/nginx/cloudflare-real-ip.conf;
real_ip_header CF-Connecting-IP;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/dayone-pages/server/public;

    server_tokens off;
    client_max_body_size 64k;

    access_log /var/log/nginx/dayone-pages.access.log;
    error_log  /var/log/nginx/dayone-pages.error.log;

    gzip on;
    gzip_types text/html text/plain application/json;
    gzip_min_length 1024;

    location / {
        # Não existe arquivo estático: tudo é decidido pelo PHP.
        fastcgi_pass unix:/run/php/php8.3-fpm-dayone.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 15s;
        fastcgi_keep_conn on;
    }
}
