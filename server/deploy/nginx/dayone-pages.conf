# /etc/nginx/sites-available/dayone-pages.conf
#
# Catch-all: any Host lands here (default_server + server_name _).
# HTTP only: TLS is Cloudflare's (Flexible mode). Everything goes to index.php.

# Cloudflare IPs, so CF-Connecting-IP becomes the real IP in the logs.
# Update with deploy/cloudflare-allowlist.sh (which also locks down the firewall).
include /etc/nginx/cloudflare-real-ip.conf;
real_ip_header CF-Connecting-IP;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/dayone-pages/server/public;

    server_tokens off;
    client_max_body_size 64k;

    access_log /var/log/nginx/dayone-pages.access.log;
    error_log  /var/log/nginx/dayone-pages.error.log;

    gzip on;
    gzip_types text/html text/plain application/json;
    gzip_min_length 1024;

    location / {
        # There are no static files: PHP decides everything.
        fastcgi_pass unix:/run/php/php8.3-fpm-dayone.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 15s;
        fastcgi_keep_conn on;
    }
}
