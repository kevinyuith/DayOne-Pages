; /etc/php/8.3/fpm/pool.d/dayone-pages.conf
[dayone]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-dayone.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

request_terminate_timeout = 20s
; The .env is read by the bootstrap; but if you prefer pool variables, use env[...].
clear_env = no

php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/php/dayone-pages.log
php_admin_value[memory_limit] = 128M
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 60
